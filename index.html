<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%233b7cf6'/%3E%3Cpath d='M50 22v30l20 12' stroke='white' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f4f6f9;
    --panel:#ffffff;
    --line:#e4e8ee;
    --line-soft:#f0f3f7;
    --text:#12161c;
    --muted:#7b8595;
    --accent:#3b7cf6;
    --best:#0e9f6e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:flex;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    touch-action:manipulation;
  }

  /* ---------- sidebar ---------- */
  .panel{
    flex:0 0 320px;
    width:320px;
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border-right:1px solid var(--line);
    z-index:2;
  }
  .brand{
    display:flex;align-items:center;gap:9px;
    padding:22px 20px 18px;
    font-size:15px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(59,124,246,.14)}

  /* ---------- sessions ---------- */
  .sessions{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:0 20px 16px;
  }
  .sessions-label{
    font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  }
  .select-wrap{position:relative;flex:0 0 auto}
  .select-wrap select{
    -webkit-appearance:none;appearance:none;
    font:inherit;font-size:12.5px;font-weight:550;color:#3d4655;
    background:#fff;border:1px solid var(--line);border-radius:9px;
    padding:7px 28px 7px 11px;
    font-variant-numeric:tabular-nums;cursor:pointer;
    transition:background .15s,border-color .15s;
  }
  .select-wrap select:hover{background:#f7f9fc;border-color:#cfd7e3}
  .select-wrap select:focus-visible{outline:2px solid rgba(59,124,246,.35);outline-offset:2px}
  .select-wrap .chev{
    position:absolute;right:10px;top:50%;transform:translateY(-52%);
    font-size:9px;color:var(--muted);pointer-events:none;
  }

  .stats-wrap{padding:0 20px 18px}
  .stat{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .stat .label{font-size:12.5px;color:var(--muted);letter-spacing:.01em}
  .stat .value{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  }
  .stat .value.best{color:var(--best)}

  .times-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px 9px;
    font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  }
  .count{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:0;color:var(--muted);background:var(--bg);
    border-radius:20px;padding:2px 8px;font-size:11px;
  }

  .times{
    list-style:none;margin:0;padding:0 0 8px;
    flex:1;overflow-y:auto;overscroll-behavior:contain;
    border-top:1px solid var(--line);
  }
  .times li{
    display:grid;grid-template-columns:42px 1fr;align-items:center;
    padding:8px 20px;
    border-bottom:1px solid var(--line-soft);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }
  .times li .idx{font-size:11.5px;color:var(--muted)}
  .times li .val{font-size:14.5px;font-weight:500;letter-spacing:.01em}
  .times li.best .val{color:var(--best);font-weight:650}
  .times li.best .idx{color:var(--best)}
  .times li.empty{
    display:block;padding:22px 20px;border:0;
    font-family:inherit;font-size:12.5px;line-height:1.6;color:var(--muted);
  }
  .times::-webkit-scrollbar{width:10px}
  .times::-webkit-scrollbar-thumb{background:#d9dfe7;border-radius:10px;border:3px solid #fff}

  .panel-foot{padding:12px 20px 16px;border-top:1px solid var(--line)}
  .clear{
    width:100%;
    padding:9px 12px;
    font:inherit;font-size:12.5px;font-weight:550;
    color:#5a6474;background:#fff;
    border:1px solid var(--line);border-radius:9px;
    cursor:pointer;transition:background .15s,border-color .15s,color .15s;
  }
  .clear:hover{background:#f7f9fc;border-color:#cfd7e3;color:#1d2634}
  .clear:active{transform:translateY(1px)}

  /* ---------- right panel (settings) ---------- */
  .panel-right{
    flex:0 0 272px;width:272px;
    border-right:0;border-left:1px solid var(--line);
    overflow-y:auto;padding-bottom:12px;
  }
  .setting-group{padding-bottom:14px}
  .group-head{
    padding:14px 20px 8px;
    font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  }
  .opt{
    display:flex;align-items:center;gap:10px;
    padding:7px 20px;cursor:pointer;
    font-size:13px;color:#3d4655;line-height:1.35;
    transition:background .15s;
  }
  .opt:hover{background:#f7f9fc}
  .opt input{
    -webkit-appearance:none;appearance:none;
    flex:0 0 auto;margin:0;width:17px;height:17px;
    display:grid;place-items:center;cursor:pointer;
    background:#fff;border:1.5px solid #cfd7e3;border-radius:5px;
    transition:background .15s,border-color .15s;
  }
  .opt input:hover{border-color:#b3bfd0}
  .opt input:checked{background:var(--accent);border-color:var(--accent)}
  .opt input:checked::after{
    content:"";width:9px;height:5px;
    border-left:2px solid #fff;border-bottom:2px solid #fff;
    transform:rotate(-45deg) translate(1px,-1px);
  }
  .opt input:focus-visible{outline:2px solid rgba(59,124,246,.35);outline-offset:2px}
  .opt .sub{display:block;font-size:11px;color:var(--muted);letter-spacing:.005em}
  .opt-text{min-width:0}

  /* ---------- timer stage ---------- */
  .stage{
    position:relative;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 35%,#ffffff 0%,var(--bg) 62%);
    padding:24px;
  }
  .stage-header{
    position:absolute;top:0;left:0;right:0;z-index:3;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:16px 26px;
    background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    backdrop-filter:blur(12px) saturate(140%);
    border-bottom:1px solid rgba(228,232,238,.9);
  }
  .header-brand{display:flex;align-items:center;gap:13px;min-width:0}
  .logo{
    flex:0 0 42px;width:42px;height:42px;border-radius:13px;
    display:grid;place-items:center;color:#fff;
    background:linear-gradient(145deg,#5b93ff 0%,#2f6ae0 100%);
    box-shadow:0 6px 16px rgba(59,124,246,.32),inset 0 1px 0 rgba(255,255,255,.4);
  }
  .logo svg{width:24px;height:24px;display:block}
  .title-row{display:flex;align-items:center;gap:8px}
  .stage-header .title{margin:0;font-size:15.5px;font-weight:650;letter-spacing:-.01em}
  .stage-header .badge{
    font-size:9.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);background:rgba(59,124,246,.1);
    border-radius:999px;padding:3px 7px;
  }
  .stage-header .tagline{margin:3px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.005em}
  .stage-header .status{
    display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;
    font-size:11px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:#5a6474;
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;
    box-shadow:0 1px 2px rgba(18,22,28,.04);white-space:nowrap;
  }
  .stage-header .status .pulse{
    width:7px;height:7px;border-radius:50%;background:var(--best);
    box-shadow:0 0 0 3px rgba(14,159,110,.14);
  }

  .timer{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-variant-numeric:tabular-nums;
    font-size:clamp(58px,11.5vw,142px);
    font-weight:250;
    line-height:1;
    letter-spacing:-.035em;
    color:var(--text);
    transition:color .18s ease;
  }
  .stage.holding .timer{color:var(--accent)}
  .timer.flash{animation:flash .62s steps(1,end) infinite}
  @keyframes flash{0%,49%{opacity:1}50%,100%{opacity:.12}}

  .hint{
    margin-top:22px;
    font-size:13px;color:var(--muted);letter-spacing:.01em;
    transition:opacity .2s ease;
  }
  .hint kbd{
    font-family:inherit;font-size:12px;font-weight:600;
    color:#4a5567;background:#fff;
    border:1px solid var(--line);border-bottom-width:2px;
    border-radius:6px;padding:2px 7px;margin:0 2px;
  }

  @media (max-width:820px){
    body{flex-direction:column}
    .stage{flex:0 0 46vh;padding:18px}
    .stage-header{padding:12px 18px;gap:12px}
    .stage-header .tagline{display:none}
    .stage-header .badge{display:none}
    .logo{flex-basis:34px;width:34px;height:34px;border-radius:11px}
    .logo svg{width:20px;height:20px}
    .stage-header .title{font-size:14px}
    .stage-header .status{font-size:10px;padding:6px 10px}
    .panel{
      flex:1 1 auto;width:100%;height:auto;min-height:0;
      border-right:0;border-top:1px solid var(--line);
    }
    .brand{padding:16px 18px 12px}
    .sessions{padding:0 18px 12px}
    .stats-wrap{padding:0 18px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
    .stat{flex-direction:column;align-items:flex-start;gap:3px;padding:6px 0;border-bottom:0}
    .stat .label{font-size:11px}
    .stat .value{font-size:14px}
    .times-head{padding:0 18px 8px}
    .times li{padding:7px 18px;grid-template-columns:36px 1fr}
    .panel-foot{padding:10px 18px 12px}
    .panel-right{
      flex:0 0 auto;width:100%;height:auto;
      border-left:0;border-top:1px solid var(--line);
      overflow:visible;padding-bottom:8px;
    }
    .panel-right .brand{padding:14px 18px 6px}
    .group-head{padding:10px 18px 6px}
    .opt{padding:6px 18px;font-size:12.5px}
    .checks{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
  }
</style>
</head>
<body>

<aside class="panel">
  <div class="brand"><span class="dot"></span>Timer App of Kshithij</div>

  <div class="sessions">
    <label class="sessions-label" for="session">Sessions</label>
    <div class="select-wrap">
      <select id="session">
        <option value="1">Session 1</option>
        <option value="2">Session 2</option>
        <option value="3">Session 3</option>
        <option value="4">Session 4</option>
        <option value="5">Session 5</option>
        <option value="6">Session 6</option>
        <option value="7">Session 7</option>
        <option value="8">Session 8</option>
        <option value="9">Session 9</option>
        <option value="10">Session 10</option>
      </select>
      <span class="chev" aria-hidden="true">▾</span>
    </div>
  </div>

  <div class="stats-wrap">
    <div class="stat">
      <span class="label">Average of 5</span>
      <span class="value" id="ao5">—</span>
    </div>
    <div class="stat">
      <span class="label">Average of 12</span>
      <span class="value" id="ao12">—</span>
    </div>
    <div class="stat">
      <span class="label">Best time</span>
      <span class="value best" id="best">—</span>
    </div>
  </div>
  <div class="stats-wrap" id="stats"></div>

  <div class="times-head">
    <span>Times</span>
    <span class="count" id="count">0</span>
  </div>
  <ol class="times" id="times"></ol>

  <div class="panel-foot">
    <button class="clear" id="clear" type="button">Clear times</button>
  </div>
</aside>

<main class="stage" id="stage">
  
  <div class="timer" id="timer">0.000</div>
  <div class="hint" id="hint">Hold <kbd>space</kbd> &nbsp;·&nbsp; release to start</div>
</main>

<aside class="panel panel-right">
  <div class="brand"><span class="dot"></span>Settings</div>

  <div class="setting-group">
    <div class="group-head">Display</div>
    <label class="opt">
      <input type="checkbox" id="opt-ms" checked>
      <span class="opt-text">Show milliseconds<span class="sub">Turn off for whole seconds</span></span>
    </label>
  </div>

  <div class="setting-group">
    <div class="group-head">Averages on the left</div>
    <div id="avg-options">
      <label class="opt"><input type="checkbox" value="5" checked><span class="opt-text">Average of 5</span></label>
      <label class="opt"><input type="checkbox" value="12" checked><span class="opt-text">Average of 12</span></label>
      <label class="opt"><input type="checkbox" value="15"><span class="opt-text">Average of 15</span></label>
      <label class="opt"><input type="checkbox" value="30"><span class="opt-text">Average of 30</span></label>
      <label class="opt"><input type="checkbox" value="50"><span class="opt-text">Average of 50</span></label>
      <label class="opt"><input type="checkbox" value="100"><span class="opt-text">Average of 100</span></label>
    </div>
  </div>
</aside>

<script>
(function () {
  "use strict";

  var STORE = "hold-timer.sessions.v1";
  var LEGACY = "hold-timer.solves.v1";
  var SESSION_COUNT = 10;
  var STORE = "hold-timer.solves.v1";
  var SETTINGS = "hold-timer.settings.v1";
  var timerEl = document.getElementById("timer");
  var hintEl  = document.getElementById("hint");
  var listEl  = document.getElementById("times");
  var countEl = document.getElementById("count");
  var stage   = document.getElementById("stage");
  var statsEl = document.getElementById("stats");

  var sessions = load();
  var solves = sessions.data[sessions.active];
  var phase = "idle";          // idle | holding | running | stopped
  var startAt = 0;
  var rafId = 0;

  var settings = loadSettings();
  var showMs = settings.ms;
  var avgs = settings.avgs;

  /* ---------- helpers ---------- */
  function validTime(t) { return typeof t === "number" && isFinite(t) && t >= 0; }
  function load() {
    var store = { active: "1", data: {} };
    for (var i = 1; i <= SESSION_COUNT; i++) store.data[String(i)] = [];

    try {
      var raw = JSON.parse(localStorage.getItem(STORE));
      if (raw && typeof raw === "object" && raw.data) {
        for (var key in store.data) {
          if (Array.isArray(raw.data[key])) store.data[key] = raw.data[key].filter(validTime);
        }
        if (store.data[String(raw.active)]) store.active = String(raw.active);
        return store;
      }
    } catch (e) {}

    // First run on this version: move the single old solve list into Session 1.
    try {
      var legacy = JSON.parse(localStorage.getItem(LEGACY));
      if (Array.isArray(legacy)) store.data["1"] = legacy.filter(validTime);
    } catch (e) {}
    return store;
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(sessions)); } catch (e) {}
  }
  function loadSettings() {
    var fallback = { ms: true, avgs: [5, 12] };
    try {
      var raw = JSON.parse(localStorage.getItem(SETTINGS));
      if (raw && typeof raw === "object") {
        return {
          ms: raw.ms !== false,
          avgs: Array.isArray(raw.avgs)
            ? raw.avgs.filter(function (n) { return typeof n === "number" && n > 1; })
            : fallback.avgs
        };
      }
    } catch (e) {}
    return fallback;
  }
  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS, JSON.stringify({ ms: showMs, avgs: avgs }));
    } catch (e) {}
  }
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function fmt(ms) {
    if (ms === null || ms === undefined) return "—";
    var t = Math.max(0, ms);
    if (showMs) {
      if (t < 60000) return (t / 1000).toFixed(3);
      var m = Math.floor(t / 60000);
      var s = (t % 60000) / 1000;
      return m + ":" + s.toFixed(3).padStart(6, "0");
    }
    var secs = Math.floor(t / 1000);
    if (secs < 60) return pad(secs);
    var mins = Math.floor(secs / 60);
    if (mins < 60) return mins + ":" + pad(secs % 60);
    return Math.floor(mins / 60) + ":" + pad(mins % 60) + ":" + pad(secs % 60);
  }
  function averageOf(n) {
    if (solves.length < n) return null;
    var sorted = solves.slice(-n).sort(function (a, b) { return a - b; });
    var kept = n >= 3 ? sorted.slice(1, -1) : sorted;
    var sum = kept.reduce(function (a, b) { return a + b; }, 0);
    return sum / kept.length;
  }
  function bestTime() {
    if (!solves.length) return null;
    return solves.reduce(function (a, b) { return b < a ? b : a; });
  }

  /* ---------- rendering ---------- */
  function render() {
    var best = bestTime();
    var stats = "";
    for (var i = 0; i < avgs.length; i++) {
      stats += '<div class="stat"><span class="label">Average of ' + avgs[i] + '</span>' +
               '<span class="value">' + fmt(averageOf(avgs[i])) + '</span></div>';
    }
    stats += '<div class="stat"><span class="label">Best time</span>' +
             '<span class="value best">' + fmt(best) + '</span></div>';
    statsEl.innerHTML = stats;

    countEl.textContent = String(solves.length);

    if (!solves.length) {
      listEl.innerHTML = '<li class="empty">No times yet.<br>Hold <b>space</b>, release, then press any key to stop.</li>';
      return;
    }

    var html = "";
    for (var i = solves.length - 1; i >= 0; i--) {
      var isBest = solves[i] === best;
      html += '<li' + (isBest ? ' class="best"' : '') + '>' +
                '<span class="idx">' + (i + 1) + '</span>' +
                '<span class="val">' + fmt(solves[i]) + '</span>' +
              '</li>';
    }
    listEl.innerHTML = html;
    listEl.scrollTop = 0;
  }

  /* ---------- timer state machine ---------- */
  function canHold() { return phase === "idle" || phase === "stopped"; }

  function beginHold() {
    if (!canHold()) return;
    phase = "holding";
    cancelAnimationFrame(rafId);
    timerEl.textContent = "00";
    timerEl.classList.add("flash");
    stage.classList.add("holding");
    hintEl.textContent = "Release to start";
  }

  function cancelHold() {
    if (phase !== "holding") return;
    phase = solves.length ? "stopped" : "idle";
    timerEl.classList.remove("flash");
    stage.classList.remove("holding");
    timerEl.textContent = solves.length ? fmt(solves[solves.length - 1]) : fmt(0);
    hintEl.innerHTML = 'Hold <kbd>space</kbd> &nbsp;·&nbsp; release to start';
  }

  function beginRun() {
    if (phase !== "holding") return;
    phase = "running";
    timerEl.classList.remove("flash");
    stage.classList.remove("holding");
    timerEl.textContent = fmt(0);
    hintEl.textContent = "Press any key to stop";
    startAt = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function tick() {
    timerEl.textContent = fmt(performance.now() - startAt);
    if (phase === "running") rafId = requestAnimationFrame(tick);
  }

  function stopRun() {
    if (phase !== "running") return;
    var elapsed = performance.now() - startAt;
    cancelAnimationFrame(rafId);
    phase = "stopped";
    timerEl.textContent = fmt(elapsed);
    solves.push(Math.round(elapsed));
    save();
    render();
    hintEl.innerHTML = 'Hold <kbd>space</kbd> to go again';
  }

  /* ---------- keyboard ---------- */
  function isSpace(e) { return e.code === "Space" || e.key === " " || e.key === "Spacebar"; }

  window.addEventListener("keydown", function (e) {
    if (e.metaKey && !isSpace(e)) return;      // leave OS shortcuts alone
    if (isSpace(e)) {
      e.preventDefault();
      if (e.repeat) return;
      if (phase === "running") { stopRun(); return; }
      beginHold();
      return;
    }
    if (phase === "running" && !e.repeat) stopRun();
  }, { passive: false });

  window.addEventListener("keyup", function (e) {
    if (isSpace(e) && phase === "holding") {
      e.preventDefault();
      beginRun();
    }
  }, { passive: false });

  /* ---------- pointer (touch / mouse) ---------- */
  stage.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    if (phase === "running") { stopRun(); return; }
    beginHold();
  });

  window.addEventListener("pointerup", function () {
    if (phase === "holding") beginRun();
  });

  window.addEventListener("pointercancel", cancelHold);
  window.addEventListener("blur", cancelHold);

  document.addEventListener("contextmenu", function (e) {
    if (stage.contains(e.target)) e.preventDefault();
  });

  /* ---------- clear ---------- */
  document.getElementById("clear").addEventListener("click", function () {
    if (!solves.length) return;
    if (window.confirm("Clear all " + solves.length + " recorded times?")) {
      solves = [];
      save();
      render();
      if (phase === "stopped") {
        phase = "idle";
        timerEl.textContent = fmt(0);
        hintEl.innerHTML = 'Hold <kbd>space</kbd> &nbsp;·&nbsp; release to start';
      }
    }
  });

  /* ---------- sessions ---------- */
  var sessionEl = document.getElementById("session");

  function switchSession(key) {
    if (key === sessions.active || !sessions.data[key]) return;
    sessions.active = key;
    solves = sessions.data[key];
    save();

    cancelAnimationFrame(rafId);
    timerEl.classList.remove("flash");
    stage.classList.remove("holding");
    phase = solves.length ? "stopped" : "idle";
    timerEl.textContent = solves.length ? fmt(solves[solves.length - 1]) : "0.000";
    hintEl.innerHTML = 'Hold <kbd>space</kbd> &nbsp;·&nbsp; release to start';
    render();
  }

  sessionEl.addEventListener("change", function () {
    if (phase === "running" || phase === "holding") {
      sessionEl.value = sessions.active;   // never swap mid-solve
      return;
    }
    switchSession(sessionEl.value);
  });

  sessionEl.value = sessions.active;
  /* ---------- settings (right panel) ---------- */
  var msBox = document.getElementById("opt-ms");
  var avgBoxes = document.querySelectorAll("#avg-options input");

  function syncSettingsUI() {
    msBox.checked = showMs;
    for (var i = 0; i < avgBoxes.length; i++) {
      avgBoxes[i].checked = avgs.indexOf(Number(avgBoxes[i].value)) !== -1;
    }
  }
  function refreshTimerLabel() {
    if (phase === "running" || phase === "holding") return;
    timerEl.textContent = (phase === "stopped" && solves.length)
      ? fmt(solves[solves.length - 1])
      : fmt(0);
  }

  msBox.addEventListener("change", function () {
    showMs = msBox.checked;
    saveSettings();
    render();
    refreshTimerLabel();
  });

  for (var b = 0; b < avgBoxes.length; b++) {
    avgBoxes[b].addEventListener("change", function () {
      avgs = Array.prototype.slice.call(avgBoxes)
        .filter(function (box) { return box.checked; })
        .map(function (box) { return Number(box.value); })
        .sort(function (x, y) { return x - y; });
      saveSettings();
      render();
    });
  }

  syncSettingsUI();
  timerEl.textContent = fmt(0);
  render();
})();
</script>
</body>
</html>
